server:
  port: ${PORT:8085}
spring:
  application:
    name: royalty-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/royalties}
    username: ${DB_USER:royalties}
    password: ${DB_PASSWORD:royalties}
royalty:
  dynamodb:
    table: ${TABLE_NAME:royalty-ledger}
    endpoint: ${DYNAMODB_ENDPOINT:}
    region: ${AWS_REGION:us-west-2}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
