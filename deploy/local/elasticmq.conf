include classpath("application.conf")

node-address {
  protocol = http
  host = elasticmq
  port = 9324
  context-path = ""
}

queues {
  plays-dlq {}
  plays {
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait = 10 seconds
    deadLettersQueue {
      name = "plays-dlq"
      maxReceiveCount = 3
    }
  }
}
